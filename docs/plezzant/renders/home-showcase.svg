      <stop offset=".35" stop-color="#292c33" stop-opacity=".68"/>
      <stop offset="1" stop-color="#14161b" stop-opacity=".78"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
