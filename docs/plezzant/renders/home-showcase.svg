<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111721"/>
      <stop offset="0.52" stop-color="#273047"/>
      <stop offset="0.78" stop-color="#9d6546"/>
      <stop offset="1" stop-color="#231a1c"/>
    </linearGradient>
    <radialGradient id="sun" cx="73%" cy="13%" r="45%">
      <stop offset="0" stop-color="#ffd99d" stop-opacity=".94"/>
      <stop offset=".32" stop-color="#d88b5c" stop-opacity=".44"/>
      <stop offset="1" stop-color="#10131a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset=".48" stop-color="#07090d" stop-opacity="0"/>
      <stop offset="1" stop-color="#07090d" stop-opacity=".92"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
