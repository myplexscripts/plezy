name: Plezzant Android TV APK

# Builds installable Plezzant APKs for every push to the plezzant branch, so
# testers can download a build from the run's "Artifacts" section without
# installing any Android tooling.

on:
  push:
    branches:
      - plezzant
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plezzant-android-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.1"

jobs:
  checks:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: false

      # Some git dependencies pin commits that are not on any branch tip, so
      # pub's mirror clone does not contain them. Fetch each locked ref into
      # the cached mirrors explicitly, then resolve again.
      - name: Resolve dependencies
        run: |
          if ! flutter pub get --enforce-lockfile --no-example; then
            refs=$(grep -E '^\s+resolved-ref:' pubspec.lock | awk '{print $2}' | tr -d '"')
            for dir in "${PUB_CACHE:-$HOME/.pub-cache}"/git/cache/*/; do
              for ref in $refs; do git -C "$dir" fetch --quiet origin "$ref" 2>/dev/null || true; done
            done
            flutter pub get --enforce-lockfile --no-example
          fi

      - name: Icon consistency
        run: dart run scripts/checks/check_icon_consistency.dart

      - name: Analyze
        run: flutter analyze --no-pub lib test

      - name: Plezzant design-system tests
        run: flutter test --no-pub test/theme

  build-apk:
    name: Build APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: false

      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: plezzant-${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      # Every build must carry the same signature, otherwise Android refuses
      # to install a new build over the previous one. A repository secret
      # (PLEZZANT_KEYSTORE_BASE64 + passwords) wins; without one, a stable
      # debug keystore is kept in the Actions cache.
      - name: Restore stable debug keystore
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.android/debug.keystore
          key: plezzant-debug-keystore-v1

      - name: Create debug keystore when missing
        run: |
          if [ ! -f ~/.android/debug.keystore ]; then
            mkdir -p ~/.android
            keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Plezzant Test Build,O=Plezzant,C=US"
          fi

      - name: Configure release signing from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.PLEZZANT_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.PLEZZANT_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.PLEZZANT_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PLEZZANT_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
            {
              echo "storePassword=$STORE_PASSWORD"
              echo "keyPassword=$KEY_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "storeFile=upload-keystore.jks"
            } > android/key.properties
          fi

      # Some git dependencies pin commits that are not on any branch tip, so
      # pub's mirror clone does not contain them. Fetch each locked ref into
      # the cached mirrors explicitly, then resolve again.
      - name: Resolve dependencies
        run: |
          if ! flutter pub get --enforce-lockfile --no-example; then
            refs=$(grep -E '^\s+resolved-ref:' pubspec.lock | awk '{print $2}' | tr -d '"')
            for dir in "${PUB_CACHE:-$HOME/.pub-cache}"/git/cache/*/; do
              for ref in $refs; do git -C "$dir" fetch --quiet origin "$ref" 2>/dev/null || true; done
            done
            flutter pub get --enforce-lockfile --no-example
          fi

      # Optional build-time overrides: your own tracker client IDs, Watch
      # Together relay and crash-report DSN. Only secrets that are set are
      # passed, so unset ones keep the built-in defaults.
      - name: Collect build overrides
        env:
          PLEZZANT_TRAKT_CLIENT_ID: ${{ secrets.PLEZZANT_TRAKT_CLIENT_ID }}
          PLEZZANT_TRAKT_CLIENT_SECRET: ${{ secrets.PLEZZANT_TRAKT_CLIENT_SECRET }}
          PLEZZANT_SIMKL_CLIENT_ID: ${{ secrets.PLEZZANT_SIMKL_CLIENT_ID }}
          PLEZZANT_MDBLIST_CLIENT_ID: ${{ secrets.PLEZZANT_MDBLIST_CLIENT_ID }}
          PLEZZANT_MAL_CLIENT_ID: ${{ secrets.PLEZZANT_MAL_CLIENT_ID }}
          PLEZZANT_TRACKER_APP_NAME: ${{ secrets.PLEZZANT_TRACKER_APP_NAME }}
          PLEZZANT_RELAY_URL: ${{ secrets.PLEZZANT_RELAY_URL }}
          PLEZZANT_SENTRY_DSN: ${{ secrets.PLEZZANT_SENTRY_DSN }}
        run: |
          python3 - <<'PY'
          import json, os
          defines = {"GIT_COMMIT": os.environ["GITHUB_SHA"]}
          for key, value in os.environ.items():
              if key.startswith("PLEZZANT_") and value:
                  defines[key] = value
          if defines.get("PLEZZANT_SENTRY_DSN"):
              defines["ENABLE_SENTRY"] = "true"
          with open("build-defines.json", "w") as f:
              json.dump(defines, f)
          print("Build overrides:", ", ".join(sorted(k for k in defines if k != "GIT_COMMIT")) or "none")
          PY

      - name: Build APKs
        run: |
          mkdir -p dist
          # One universal APK that installs on any device, plus smaller
          # per-CPU APKs for people who know which one they need.
          flutter build apk --release --dart-define-from-file=build-defines.json
          cp build/app/outputs/flutter-apk/app-release.apk dist/plezzant-universal.apk
          flutter build apk --release --split-per-abi --dart-define-from-file=build-defines.json
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/plezzant-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/plezzant-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk dist/plezzant-x86_64.apk
          ls -la dist

      # Android refuses unsigned APKs with a bare "App not installed", so a
      # build that is not signed must fail here rather than on someone's TV.
      - name: Verify APK signatures
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          for apk in dist/*.apk; do
            "$apksigner" verify --print-certs "$apk" | head -3
          done

      - name: Clean up signing material
        if: always()
        run: rm -f android/app/upload-keystore.jks android/key.properties

      - name: Upload APKs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: plezzant-apks
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30
